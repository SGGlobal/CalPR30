name: Test

on:
  pull_request:
    branches:
      - phase-8-tradingview-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restrict workflow_dispatch to approved SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ab93ccbd32d21b2f475ab71b3327cf3398d8c4ed
          FEATURE_BRANCH: feature/bridge-02-authenticated-handoff
        run: |
          set -euo pipefail
          if ! git fetch origin "$APPROVED_SHA"; then
            echo "Direct SHA fetch failed; fetching known feature branch."
            git fetch origin "$FEATURE_BRANCH"
          fi
          git checkout --detach "$APPROVED_SHA"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$APPROVED_SHA" ]; then
            echo "SHA mismatch: $HEAD_SHA != $APPROVED_SHA"
            exit 1
          fi
          echo "Verified approved SHA: $HEAD_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest
